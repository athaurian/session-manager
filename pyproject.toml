[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "session-manager"
version = "1.0.0"
description = "Save and restore a Sway or i3 window manager session"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hanif Ilham Athaurrahman" }]
keywords = ["sway", "i3", "wayland", "x11", "window-manager", "session"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: Window Managers",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/athaurian/session-manager"
Repository = "https://github.com/athaurian/session-manager"
Issues = "https://github.com/athaurian/session-manager/issues"


[project.scripts]
session-manager = "session_manager.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["session_manager*"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
