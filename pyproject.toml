[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "session-manager"
version = "0.1.0"
description = "Save and restore a Sway or i3 window manager session"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hanif Ilham Athaurrahman" }]

[project.scripts]
session-manager = "session_manager.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["session_manager*"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
